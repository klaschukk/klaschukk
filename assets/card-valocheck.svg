<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 226" width="400" height="226" role="img" aria-label="ValoCheck — valocheck.com">
<defs><linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4655"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
<linearGradient id="sv" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="gv" cx=".85" cy="0" r="1"><stop offset="0" stop-color="#ff4655" stop-opacity=".35"/><stop offset="1" stop-color="#ff4655" stop-opacity="0"/></radialGradient>
<clipPath id="kv"><rect x="1" y="1" width="398" height="224" rx="20"/></clipPath></defs>
<style>.sh{animation:sh 3.6s ease-in-out infinite}@keyframes sh{from{transform:translateX(-160px)}to{transform:translateX(420px)}}
.in{opacity:0;animation:u .8s ease-out forwards}@keyframes u{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>
<rect x="1" y="1" width="398" height="224" rx="20" fill="#0d1421" stroke="#ffffff" stroke-opacity=".12"/>
<g clip-path="url(#kv)"><rect width="400" height="226" fill="url(#gv)"/>
<rect y="218" width="400" height="8" fill="url(#av)"/><rect class="sh" y="218" width="160" height="8" fill="url(#sv)" opacity=".55"/></g>
<g class="in"><rect x="24" y="22" width="148" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".45"/>
<circle cx="42" cy="37" r="4.5" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="55" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#a7f3d0">valocheck.com</text></g>
<text class="in" style="animation-delay:.15s" x="24" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="36" font-weight="800" fill="url(#av)">ValoCheck</text>
<text class="in" style="animation-delay:.3s" x="24" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#c9d1d9">Fast Valorant stat checker</text>
<text class="in" style="animation-delay:.4s" x="24" y="151" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8b98a9">Profiles, leaderboards, crosshairs</text>
