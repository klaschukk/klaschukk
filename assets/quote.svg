<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Quote">
<defs><linearGradient id="qb" x1="0" x2="1"><stop offset="0" stop-color="#0d1421"/><stop offset="1" stop-color="#121a33"/></linearGradient></defs>
<style>.q{opacity:0;animation:qc 18s infinite}.q2{animation-delay:6s}.q3{animation-delay:12s}
@keyframes qc{0%{opacity:0;transform:translateY(10px)}3%{opacity:1;transform:none}30%{opacity:1;transform:none}33%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
.mk{animation:pl 5s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}</style>
<rect x=".5" y=".5" width="1199" height="169" rx="20" fill="url(#qb)" stroke="#ffffff" stroke-opacity=".12"/>
<text class="mk" x="46" y="128" font-family="Georgia,serif" font-size="140" fill="#5eead4" opacity=".22">“</text>
<text class="mk" x="1110" y="150" font-family="Georgia,serif" font-size="140" fill="#a78bfa" opacity=".22">”</text>
<g class="q q1"><text x="600" y="78" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="28" fill="#e6edf3">Talk is cheap. Show me the code.</text><text x="600" y="122" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#5eead4">— Linus Torvalds</text></g><g class="q q2"><text x="600" y="78" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="28" fill="#e6edf3">Make it work, make it right, make it fast.</text><text x="600" y="122" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#5eead4">— Kent Beck</text></g><g class="q q3"><text x="600" y="62" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="28" fill="#e6edf3">Perfection is achieved, not when there is nothing more to add,</text><text x="600" y="98" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="28" fill="#e6edf3">but when there is nothing left to take away.</text><text x="600" y="142" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#5eead4">— Antoine de Saint-Exupéry</text></g></svg>